app = "thndr-plan"
primary_region = "fra"

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"
  MAX_PAR = "2"
  WORKER_MB = "1400"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 2

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

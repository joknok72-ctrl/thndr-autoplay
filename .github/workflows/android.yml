name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK (debug-signed, installable)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk THNDR-AutoPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: THNDR-AutoPlay-apk
          path: THNDR-AutoPlay.apk

      - name: Publish to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: THNDR AutoPlay (latest build)
          body: |
            📱 نزّل THNDR-AutoPlay.apk وثبّته على الموبايل.
            الخطوات: افتح التطبيق → فعّل الأذونات (فوق التطبيقات + خدمة الوصول) → ابدأ → افتح لعبة THNDR → اضغط الزر العائم ▶
          files: THNDR-AutoPlay.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
